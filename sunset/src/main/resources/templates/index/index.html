<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
    <h1>노을</h1>
    <a href="/board/list" style="color: #64ffda;">문의 게시판</a>
</header>

<main class="main-wrapper">
    <div class="content">
        <h2>안녕하세요! 노을입니다.</h2>
        <p>질문이 있으시면 문의 게시판을 이용해주세요.</p>
    </div>

    <div class="login-box">
        <h3>로그인</h3>
        <form action="/siteuser/login" method="POST">
            <input type="text" name="username" placeholder="아이디">
            <input type="password" name="password" placeholder="비밀번호">
            <button type="submit">로그인</button>
        </form>
        <p><a href="/siteUser/chuga" style="color: #64ffda;">회원가입</a></p>
    </div>
</main>
</body>
</html>
