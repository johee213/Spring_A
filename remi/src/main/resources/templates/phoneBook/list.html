<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h1> 메모 목록 </h1>

<table border="1">
    <tr>
<!--        아래도 갯수 6개 맞아야함-->
        <th>순번</th>
        <th>작성자</th>
        <th>전화번호</th>
        <th>주소</th>
         <th>등록일</th>
        <th>수정일</th>
    </tr>

    <tr th:each="phoneBook, status : ${list}">

        <td th:text="${phoneBook.id}"></td>

        <td th:text="${phoneBook.name}"></td>

        <td th:text="${phoneBook.phone}"></td>


        <td th:text="${phoneBook.address}"></td>

        <td>
            <span th:text="${phoneBook.createdDate}"></span><br>
            <span th:text="${#temporals.format(phoneBook.createdDate, 'yyyy-MM-dd')}"></span><br>
            <span th:text="${#strings.substring(phoneBook.createdDate,0,10)}"></span><br>
        </td>
        <td>
            <span th:text="${phoneBook.modifiedDate}"></span><br>
            <span th:text="${#temporals.format(phoneBook.modifiedDate, 'yyyy-MM-dd')}"></span><br>
            <span th:text="${#strings.substring(phoneBook.modifiedDate,0,10)}"></span><br>
        </td>





<!--        <td th:text="${#temporals.format(memo.createdDate, 'yyyy-MM-dd)}"></td>-->
<!--        <td th:text="${memo.modifiedDate}"></td>-->
<!--        <td th:text="${#temporals.format(memo.modifiedDate, 'yyyy-MM-dd)}"></td>-->
<!--        <td th:text="${#strings.substring(memo.createdDate,0,10)}"></td>-->
    </tr>

</table>

</body>
</html>
